# Egress proxy of the Agent sandboxes. They sit on an internal Docker network whose only way out is this proxy:
# public HTTP and HTTPS are allowed, the LAN, this host, Docker networks and other private addresses are refused.
http_port 3128
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl private_dst dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
acl ssl_ports port 443
acl safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny manager
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny private_dst
http_access allow all
cache deny all
cache_mem 8 MB
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename /run/squid/squid.pid
coredump_dir /tmp
via off
forwarded_for delete
shutdown_lifetime 2 seconds
