  #   goal: |
  #     用 LTspice 仿真 R=1 kΩ、C=100 nF 的一阶 RC 低通滤波器，求 -3 dB 截止频率并和理论值比较……
  #   workerModel: deepseek-flash        # 操作虚拟机要能看图的模型
  #   budget: { vms: 1, hours: 2 }       # 用虚拟机的任务受主机资源限制，同时最多约 2 个
